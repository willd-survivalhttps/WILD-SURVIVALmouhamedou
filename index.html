/* worlds, saves, menus */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wlist=()=>LS.keys().filter(k=>k.startsWith('ws3d:w:')).map(k=>LS.get(k)).filter(Boolean).sort((a,b)=>b.at-a.at);
function save(){if(!wname||!p)return;LS.set('ws3d:w:'+wname,{name:wname,seed:wseed,time,at:Date.now(),p:{x:p.x,z:p.z,hp:p.hp,fd:p.fd,wt:p.wt,st:p.st,yaw:p.yaw},inv,eq,sel,placed:placed.map(o=>({t:o.t,x:o.x,z:o.z,ry:o.ry,life:o.life}))})}
function clearDyn(){while(dyn.children.length)dyn.remove(dyn.children[0]);placed=[];en=[]}
let inGame=false,MODE='single';
function startWorld(name,seed,data,mode,thenHost){MODE=mode||'single';if(MODE=='single'){leaveRoom();closeP2P()}$('ov').innerHTML='<h1>Generating islands...</h1>';$('ov').className='solid';
setTimeout(()=>{wname=name;wseed=seed;buildWorld(seed);clearDyn();newPlayer();time=0;
if(data){time=data.time||0;Object.assign(p,data.p);inv=data.inv||{};eq=Object.assign(eq,data.eq);sel=data.sel||'hand';p.boat=null;(data.placed||[]).forEach(o=>mkPlaced(o.t,o.x,o.z,o.ry,o.life))}
p.y=hAt(p.x,p.z)+1.7;setHand();msgs=[];W=1;inGame=true;state=1;UI=0;if(MODE=='multi')mpJoin();if(thenHost){save();G.host();return}$('ov').style.display='none';lockPtr();save();saveT=30;msg(data?'World loaded':'Gather wood and stone, then open your pack (I) to craft')},30)}
const MB=(l,f,c)=>'<button class="mb '+(c||'')+'" onclick="'+f+'">'+l+'</button>';
function menu(s){state=0;sw=false;UI=0;$('pk').style.display='none';$('mpw').style.display='none';$('ov').style.display='flex';$('ov').className=(s=='main'||!W)?'solid':'';let h='';
if(s=='main')h='<h1>Wild Survival 3D</h1><p>One hundred islands, one pile of wood. Craft, sail and survive the night.</p>'+MB('Singleplayer',"menu('single')")+MB('Multiplayer',"menu('mp')")+MB('Character',"G.set2('main')",'g')+MB('Settings',"G.set('main')",'g');
else if(s=='new')h='<h2>New world</h2><input id="wn" type="text" maxlength="24" placeholder="World name" value="World '+(wlist().length+1)+'"><input id="wsd" type="text" maxlength="24" placeholder="Seed (empty = random)">'+MB('Create world',"G.create()")+MB('Back',"menu('main')",'g');
else if(s=='load'){G.list=wlist();h='<h2>Your worlds</h2>'+(G.list.length?G.list.map((w,i)=>'<div class="wr"><span>'+esc(w.name)+'<br><small>Day '+(Math.floor((w.time||0)/DAY)+1)+' · seed '+esc(w.seed)+'</small></span><span><button onclick="G.play('+i+')">Play</button> <button class="g" style="background:#5a2a22;color:#fff" onclick="G.del('+i+')">'+(G.pend===i?'Sure?':'Delete')+'</button></span></div>').join(''):'<p>No saved worlds yet.</p>')+MB('Back',"menu('main')",'g')}
else if(s=='set')h='<h2>Settings</h2><div class="st"><label>Mouse speed</label><input type="range" min="0.3" max="2.5" step="0.1" value="'+CFG.sens+'" oninput="G.cfg(\'sens\',+this.value)"></div><div class="st"><label>View distance</label><input type="range" min="60" max="300" step="10" value="'+CFG.view+'" oninput="G.cfg(\'view\',+this.value)"></div><div class="st"><label>Field of view</label><input type="range" min="55" max="100" step="1" value="'+CFG.fov+'" oninput="G.cfg(\'fov\',+this.value)"></div><div class="st"><label>Shadows</label><input type="checkbox" '+(CFG.shadows?'checked':'')+' onchange="G.cfg(\'shadows\',this.checked?1:0)"></div>'+MB('Back',"menu('"+G.from+"')",'g');
else if(s=='single')h='<h2>Singleplayer</h2><p>Just you on the islands. Nobody else can join.</p>'+MB('New world',"menu('new')")+MB('Load world',"menu('load')",'g')+MB('Back',"menu('main')",'g');
else if(s=='mphost'){G.list=wlist();h='<h2>Host a multiplayer world</h2>'+G.list.map((w,i)=>'<div class="wr"><span>'+esc(w.name)+'</span><button onclick="G.play('+i+',\'multi\',1)">Host</button></div>').join('')+'<input id="hn" type="text" maxlength="24" placeholder="New world name" value="Our world"><input id="hs" type="text" maxlength="24" placeholder="Seed (empty = random)">'+MB('Host a new world',"G.hostNew()")+MB('Back',"menu('mp')",'g')}
else if(s=='mp')h='<h2>Multiplayer</h2><p>No server needed. One player hosts a world, the others join by swapping two short codes (send them in any chat app).</p>'+MB(inGame?'Host this world':'Host a world',inGame?"G.host()":"menu('mphost')")+MB('Join a friend',"menu('join')",'g')+MB('Back',"menu('"+(inGame?'pause':'main')+"')",'g');
else if(s=='hostui')h='<h2>Host</h2><p>1. Send this code to your friend:</p><textarea id="mc" readonly rows="4"></textarea>'+MB('Copy code',"G.copy('mc')",'g')+'<p>2. Paste the answer code your friend sends back:</p><textarea id="ma" rows="4"></textarea><p id="me" style="color:#f0b060"></p>'+MB('Connect',"G.hostGo()")+MB('Add another friend',"G.host()",'g')+MB('Back to game',"G.resume()",'g');
else if(s=='join')h='<h2>Join a friend</h2><p>1. Paste the host code here:</p><textarea id="jc" rows="4"></textarea><p id="me" style="color:#f0b060"></p>'+MB('Create my answer code',"G.join()")+MB('Back',"menu('mp')",'g');
else if(s=='skin'){const sk=CFG.skin;h='<h2>Your character</h2><div class="st"><label>Name</label><input id="pn" type="text" maxlength="16" value="'+esc(CFG.pname)+'" oninput="G.pname(this.value)" style="width:140px;padding:6px;border-radius:4px;border:1px solid #6b4a2b;background:#1c140c;color:#ece6d4"></div><div class="st"><label>Skin</label><input type="color" value="'+sk.s+'" oninput="G.skin(\'s\',this.value)"></div><div class="st"><label>Shirt</label><input type="color" value="'+sk.t+'" oninput="G.skin(\'t\',this.value)"></div><div class="st"><label>Pants</label><input type="color" value="'+sk.p+'" oninput="G.skin(\'p\',this.value)"></div><div class="st"><label>Presets</label><span>'+PRE.map((q,i)=>'<button onclick="G.pre('+i+')" style="margin:2px;background:'+q[2]+'">'+q[0]+'</button>').join('')+'</span></div><p>Press V in game for third person to see your skin. Other players see it too.</p>'+MB('Back',"menu('"+G.from+"')",'g')}
else if(s=='pause')h='<h2>Paused</h2><p>'+esc(wname)+' · Day '+(Math.floor(time/DAY)+1)+'</p>'+MB('Resume',"G.resume()")+MB('Save world',"G.saveNow()",'g')+MB('Multiplayer',"menu('mp')",'g')+MB('Character',"G.set2('pause')",'g')+MB('Settings',"G.set('pause')",'g')+MB('Save and quit to menu',"G.quit()",'g');
else if(s=='dead')h='<h1>You died</h1><p>You survived '+Math.floor(time/DAY)+' day(s). Respawn on the starting island without your items, or return to the menu.</p>'+MB('Respawn',"G.resp()")+MB('Main menu',"G.quit()",'g');
$('ov').innerHTML=h}
const G={list:[],pend:-1,from:'main',
create(){let n=($('wn').value||'World').trim()||'World',s=($('wsd').value||'').trim()||String(Math.floor(Math.random()*1e9));const names=wlist().map(w=>w.name),b=n;let i=2;while(names.includes(n))n=b+' '+i++;startWorld(n,s)},
play(i,m,h){const w=G.list[i];if(w)startWorld(w.name,w.seed,w,m||'single',h)},
del(i){const w=G.list[i];if(!w)return;if(G.pend===i){LS.del('ws3d:w:'+w.name);G.pend=-1}else G.pend=i;menu('load')},
hostNew(){let n=($('hn').value||'World').trim()||'World',s=($('hs').value||'').trim()||String(Math.floor(Math.random()*1e9));const names=wlist().map(w=>w.name),b=n;let i=2;while(names.includes(n))n=b+' '+i++;startWorld(n,s,null,'multi',1)},
cfg(k,v){CFG[k]=v;applyCfg()},
async host(){if(!inGame){menu('mphost');return}if(MODE!='multi'){MODE='multi';mpJoin()}
$('ov').innerHTML='<h2>Preparing your code...</h2>';try{const code=await hostOffer();menu('hostui');$('mc').value=code}catch(e){menu('mp')}},
async hostGo(){try{await hostAccept($('ma').value);$('me').textContent='Connecting... your friend appears in the game when it works. You can go back to the game.'}catch(e){$('me').textContent='That answer code is not valid.'}},
async join(){try{const a=await guestAnswer($('jc').value);$('ov').innerHTML='<h2>Your answer code</h2><p>Send this code back to the host. The game starts by itself once you are connected.</p><textarea id="ja" readonly rows="5"></textarea>'+MB('Copy code',"G.copy('ja')")+MB('Back',"menu('main')",'g');$('ja').value=a}catch(e){$('me').textContent='That host code is not valid.'}},
copy(id){const t=$(id);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}},set(f){G.from=f;menu('set')},set2(f){G.from=f;menu('skin')},skin(k,v){CFG.skin[k]=v;applyCfg()},pname(v){CFG.pname=v.slice(0,16);LS.set('ws3d:cfg',CFG)},pre(i){const q=PRE[i];CFG.skin={s:q[1],t:q[3],p:q[4]};applyCfg();menu('skin')},
resume(){state=1;$('ov').style.display='none';lockPtr()},saveNow(){save();msg('World saved');G.resume()},quit(){save();inGame=false;leaveRoom();closeP2P();menu('main')},
resp(){const hp=placed;newPlayer();p.y=hAt(0,0)+1.7;setHand();msgs=[];en.forEach(e=>dyn.remove(e.g));en=[];state=1;$('ov').style.display='none';lockPtr();save();msg('You wake up on the starting island')}};
/* input */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(state!=1)return;if([' ','arrowup','arrowdown','arrowleft','arrowright','tab'].includes(k))e.preventDefault();
if(k=='escape'){if(UI)closeUI();return}if(k=='i'||k=='tab'){UI==1?closeUI():openPack();return}if(k=='m'){UI==2?closeUI():openMap();return}
if(!K[k])act(k);K[k]=true});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=false});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&state==1&&!UI&&!isTouch)menu('pause')});
document.addEventListener('mousemove',e=>{if(state!=1||isTouch||UI)return;if(document.pointerLockElement==cv||(e.buttons&1)){p.yaw-=e.movementX*.0022*CFG.sens;p.pitch=cl(p.pitch-e.movementY*.0022*CFG.sens,-1.4,1.4)}});
cv.addEventListener('mousedown',e=>{if(state!=1||isTouch||UI)return;if(document.pointerLockElement==cv)sw=true;else lockPtr()});
addEventListener('mouseup',()=>{if(!isTouch)sw=false});
cv.addEventListener('pointerdown',e=>{if(e.pointerType!='touch'||state!=1||UI)return;isTouch=true;document.body.classList.add('touch');const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
if(px<r.width/2&&joyId<0){joyId=e.pointerId;joyO={x:px,y:py};joy={x:0,y:0}}else if(lookId<0){lookId=e.pointerId;lp={x:px,y:py}}});
addEventListener('pointermove',e=>{if(e.pointerType!='touch')return;const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
if(e.pointerId==joyId){const a=px-joyO.x,b=py-joyO.y,l=Math.hypot(a,b)||1,k=Math.min(l,50)/50;joy={x:a/l*k,y:b/l*k}}
else if(e.pointerId==lookId&&p){p.yaw-=(px-lp.x)*.005*CFG.sens;p.pitch=cl(p.pitch-(py-lp.y)*.005*CFG.sens,-1.4,1.4);lp={x:px,y:py}}});
addEventListener('pointerup',e=>{if(e.pointerId==joyId){joyId=-1;joy=null}if(e.pointerId==lookId)lookId=-1});
addEventListener('touchstart',()=>{isTouch=true;document.body.classList.add('touch')},{once:true,passive:true});
function cycleTool(){const o=['axe','spear','pick','sword','rod','hand'],i=o.indexOf(sel);for(let j=1;j<=6;j++){const s=o[(i+j)%6];if(s=='hand'||eq[s]>0){setSel(s);return}}}
document.querySelectorAll('#tb button').forEach(b=>{const a=b.dataset.a;
if(a=='h'){b.addEventListener('pointerdown',e=>{e.stopPropagation();sw=true});b.addEventListener('pointerup',()=>sw=false);b.addEventListener('pointerleave',()=>sw=false)}
else b.addEventListener('pointerdown',e=>{e.stopPropagation();if(state!=1)return;if(a=='i')UI==1?closeUI():openPack();else if(a=='m')UI==2?closeUI():openMap();else if(a=='t')cycleTool();else if(a=='p')menu('pause');else act(a)})});
$('pk').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='pkx')closeUI();else if(b.dataset.c)craft(b.dataset.c);else if(b.dataset.u)useItem(b.dataset.u)});
$('mpw').addEventListener('click',closeUI);
applyCfg();menu('main');let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(state==1)update(dt);if(W){hud();ren.render(scene,cam)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
